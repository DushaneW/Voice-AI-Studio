name: Verify NEXUS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install -e './runtime[test]' ruff
      - run: python scripts/sync_version.py --check
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m ruff check runtime
      - run: python -m ruff format --check runtime
      - run: python -m pytest runtime/tests -q
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p nexus-supervisor -- -D warnings
      - run: NEXUS_TEST_PYTHON="$(command -v python)" cargo test -p nexus-supervisor -- --include-ignored
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: apps/desktop
  packaged-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './runtime[test]' pyinstaller
      - run: python scripts/package_runtime.py --core-only
      - run: python scripts/verify_packaged_runtime.py "build/runtime/dist/nexus-runtime${{ runner.os == 'Windows' && '.exe' || '' }}"
  native-linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - run: python -m pip install -e './runtime[test]' pyinstaller
      - run: python scripts/package_runtime.py --core-only
      - name: Stage diagnostic sidecar for compile verification only
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp build/runtime/dist/nexus-runtime apps/desktop/src-tauri/binaries/nexus-runtime-x86_64-unknown-linux-gnu
      - run: cargo check -p nexus-desktop --locked
