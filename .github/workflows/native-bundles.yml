name: Build complete native candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'crates/**'
      - 'scripts/package_runtime.py'
      - 'scripts/verify_packaged_runtime.py'
      - 'runtime/pyproject.toml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage'}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, bundles: 'nsis,msi'}
          - {os: macos-15-intel, target: x86_64-apple-darwin, bundles: dmg}
          - {os: macos-15, target: aarch64-apple-darwin, bundles: dmg}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: python -m pip install -e './runtime[ai,test]' pyinstaller
      - run: python scripts/sync_version.py --check
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m pytest runtime/tests -q
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: apps/desktop
      - name: Package AI-capable runtime (no diagnostic fallback)
        run: python scripts/package_runtime.py
      - run: python scripts/verify_packaged_runtime.py "build/runtime/dist/nexus-runtime${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Build installers
        env:
          NO_STRIP: 'true'
        run: npm run tauri build -- --bundles '${{ matrix.bundles }}'
        working-directory: apps/desktop
      - run: python scripts/collect_native_artifacts.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: build/native-candidate/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
  complete-package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-*
          path: build/downloaded-native
      - run: python scripts/assemble_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-complete-all-platforms
          path: build/distribution/
          if-no-files-found: error
          retention-days: 14
